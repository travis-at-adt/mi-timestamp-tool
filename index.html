<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mock Intrusion Timestamp Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Mock Intrusion Timestamp Tool</h1>
    <main>
        <div class="event-type">
            <h2><label for="event-type">Select event type</label></h2>
            <select id="event-type" name="event-type">
                <option value="" selected disabled></option>
                <option value="fast-walking">Fast Walking</option>
                <option value="freestyle-intrusion-walking">FreeStyle Intrusion Walking</option>
                <option value="sneaking">Sneaking</option>
                <option value="walking">Walking</option>
            </select>
        </div>
        <div class="button-row">
            <button id="start-btn" type="button" disabled>Add Start Timestamp</button>
            <button id="stop-btn" type="button" disabled>Add Stop Timestamp</button>
        </div>
    </main>
    <footer>
        <button id="submit-btn" type="button" disabled>Submit event timestamp</button>
    </footer>
</body>
</html>
